version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: uniguard-postgres
    environment:
      POSTGRES_DB: uniguard
      POSTGRES_USER: uniguard_user
      POSTGRES_PASSWORD: uniguard_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniguard_user -d uniguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: uniguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
